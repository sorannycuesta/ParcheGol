<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de canchas disponibles en ParcheGol.">
    <title>Catálogo de canchas | ParcheGol</title>

    <!-- Estilos y fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar-footer/navbar.css">
    <link rel="stylesheet" href="css/navbar-footer/footer.css">

    <script src="https://kit.fontawesome.com/2b9c7542e8.js" crossorigin="anonymous"></script>

    <script src="js/main.js" defer></script>
    <script src="js/catalogo.js" defer></script>
</head>

<body class="text-white">
    <header>
        <app-navbar></app-navbar>
        <app-sidebar></app-sidebar>
    </header>

    <main class="container py-5 mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <p class="text-info fw-bold small mb-0">ZONA DE JUEGO</p>
                <h1 class="fw-bold text-dark mb-1">Catálogo de canchas disponibles</h1>
                <p class="text-secondary">Elige tu sede preferida y asegura tu partido en segundos.</p>
            </div>
            <div id="contadorCatalogo" class="badge bg-success bg-opacity-45 border border-success text-light px-3 py-2 rounded-pill">
                🟢 0 canchas
            </div>
        </div>

        <!-- Contenedor donde  inserta las tarjetas -->
        <div id="contenedorCatalogo" class="row g-4">
            <!-- Las tarjetas se generan automáticamente aquí -->
        </div>

        <!-- Estado vacío si no hay canchas -->
        <div id="estadoVacioCatalogo" class="text-center py-5" style="display: none;">
            <i class="bi bi-dribbble display-1 text-secondary"></i>
            <h3 class="text-white mt-3">No hay canchas registradas por el momento</h3>
            <p class="text-secondary">Vuelve más tarde o contacta al administrador para registrar nuevas sedes.</p>
        </div>
    </main>

    <app-footer></app-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
