<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | ParcheGol</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar-footer/navbar.css">
    <link rel="stylesheet" href="css/admin.css">


    <script src="js/main.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <app-navbar></app-navbar>
        <app-sidebar></app-sidebar>
    </header>
    <section class="container flex-grow-1 d-flex align-items-center">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card-bady">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">ParcheGol</h2>
                        <h4>Crear cuenta</h4>
                        <p class="text-muted">Regístrate para reservar tu cancha</p>
                    </div>
                    <!--Formulario pal registro-->
                    <form id="formRegistro">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre Completo"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Número de télefono</label>
                            <input type="tel" class="form-control" id="telefono"
                                placeholder="Ingresa tu número de télefono" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="Crea una contraseña"
                                required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            Crear cuenta
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src=""></script>

</body>

</html>
