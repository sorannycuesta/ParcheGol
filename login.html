<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | ParcheGol</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/registro.css">
    <link rel="stylesheet" href="css/navbar-footer/navbar.css">
    <link rel="stylesheet" href="css/admin.css">

    <script src="https://kit.fontawesome.com/2b9c7542e8.js" crossorigin="anonymous"></script>
    <script src="js/main.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <app-navbar></app-navbar>
        <app-sidebar></app-sidebar>
    </header>
    <section class="container flex-grow-1 d-flex align-items-center">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card-bady">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">ParcheGol</h2>
                        <h4>Iniciar sesión</h4>
                        <p class="text-muted">Ingresa para continuar</p>
                    </div>
                    <!--Formulario pal inicio de sesión-->
                    <form id="formLogin" novalidate>
                        <div class="admin-field mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="correo@gmail.com"
                                autocomplete="email" required>
                            <div class="valid-feedback">Correo válido.</div>
                            <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
                        </div>
                        <!-- Campo Contraseña -->
                        <div class="admin-field mb-3">
                            <label for="password" class="form-label admin-form-label">Contraseña</label>

                            <div class="input-group password-input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control border-start-0 border-end-0 ps-1"
                                    id="password" name="password" placeholder="Ingresa tu contraseña"
                                    autocomplete="current-password" required>
                                <button class="btn btn-eye border-start-0" type="button" id="togglePassword"
                                    aria-label="Mostrar u ocultar contraseña" title="Mostrar contraseña">
                                    <i class="bi bi-eye" id="iconoOjo"></i>
                                </button>
                            </div>
                            <div class="valid-feedback">Campo correcto!</div>
                            <div class="invalid-feedback">Ingresa tu contraseña.</div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn admin-submit-btn">
                                <i class="bi bi-check2-circle me-2"></i>Iniciar sesión
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <span class="text-muted small">¿No tienes cuenta?</span>
                            <a href="registro.html" class="small ms-1">Regístrate aquí</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
