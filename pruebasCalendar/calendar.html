<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>PruebasCalendar</title>
</head>

<body>
    <section class="container">
        <div class="row g-4 justify-content-center">
            <div class="col-12">
                <form id="formReserva">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre del cliente</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" required>
                    </div>

                    <div class="mb-3">
                        <label for="cancha" class="form-label">Cancha</label>
                        <select class="form-select" id="cancha" required>
                            <option value="" selected disabled>Seleccionar cancha</option>
                            <option value="Cancha 1">Cancha 1</option>
                            <option value="Cancha 2">Cancha 2</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="fecha" class="form-label">Fecha de reserva</label>
                        <input type="date" class="form-control" id="fecha" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="horaInicio" class="form-label">Hora inicial</label>
                            <input type="time" class="form-control" id="horaInicio" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="horaFin" class="form-label">Hora final</label>
                            <input type="time" class="form-control" id="horaFin" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="observaciones" class="form-label">Observaciones</label>
                        <textarea class="form-control" id="observaciones" rows="2"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Guardar reserva
                    </button>

                </form>

            </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="calendar.js"></script>
</body>

</html>
