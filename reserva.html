<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParcheGol - Reservas</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="reserva.css" rel="stylesheet">

  <script src="https://kit.fontawesome.com/2b9c7542e8.js" crossorigin="anonymous"></script>
  <script src="js/main.js" defer></script>
  <script src="js/admin.js" defer></script>
  <script src="js/reserva.js" defer></script>
</head>

<body>

  <header>
    <app-navbar></app-navbar>
    <app-sidebar></app-sidebar>
  </header>

  <div class="main-wrapper">
    <main class="container-fluid px-4 py-4">


      <div class="mb-4">
        <div class="d-flex align-items-center gap-2 mb-1">
          <i class="bi bi-shield-lock text-muted fs-6"></i>
          <span class="text-uppercase text-muted fw-bold tracking-wider" style="font-size: 0.75rem;">PARCHEGOL
            RESERVAS</span>
        </div>
        <h2 class="fw-bold mb-1">Reservas</h2>
      </div>

      <div class="row g-4">
        <!-- Form -->
        <div class="col-xl-5 col-lg-6 ">
          <div class="card shadow-sm rounded-4">
            <div class="card-body p-4 bg-dark">

              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="text-uppercase text-muted fw-bold tracking-wider" style="font-size: 0.68rem;">REGISTRO DE
                  RESERVA</span>

              </div>
              <h5 class="fw-bold mb-1">Nueva reserva</h5>
              <p class="text-muted small mb-4">Completa la información para agendar tu espacio en la plataforma.</p>

              <form id="formReserva">
                <!-- seleccion de cancha-->
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">Cancha a reservar</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-dribbble"></i></span>
                    <select class="form-select" id="canchaSelect" required>
                      <option value="" selected disabled>Selecciona una cancha</option>
                      <option value="1">Cancha La 10 - Fútbol 5</option>
                      <option value="2">Cancha El Campín - Sintética</option>
                      <option value="3">Cancha San José - Microfútbol</option>
                    </select>
                  </div>
                </div>

                <!-- dato cliente -->
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">Nombre usuario</label>
                  <input type="text" class="form-control" id="clienteInput" placeholder="Ej. Luisa Sánchez" required>
                </div>

                <!-- dato telefono-->
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">Teléfono de contacto</label>
                  <input type="tel" class="form-control" id="telefonoInput" placeholder="Ej. 3002676198" required>
                </div>

                <!-- Fecha -->
                <div class="mb-3">
                  <label class="form-label text-muted small fw-semibold">Fecha de reserva</label>
                  <input type="date" class="form-control" id="fechaInput" required>
                </div>

                <!-- Horario reserva -->
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label class="form-label text-muted small fw-semibold">Hora de inicio</label>
                    <input type="time" class="form-control" id="horaInicioInput" value="18:00" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label text-muted small fw-semibold">Duración (horas)</label>
                    <input type="number" class="form-control" id="duracionInput" min="1" max="3" value="2" required>
                  </div>
                </div>

                <!-- costo -->
                <div class="mb-4">
                  <label class="form-label text-muted small fw-semibold">Costo total</label>
                  <input type="text" class="form-control bg-body-tertiary" id="valorInput" placeholder="$ 80.000"
                    readonly>
                </div>

                <!-- Agendar -->
                <button type="submit"
                  class="btn btn-neon w-100 py-2 mb-2 d-flex align-items-center justify-content-center gap-2">
                  <i class="bi bi-calendar-plus"></i>
                  <span>Agendar reserva</span>
                </button>

                <!-- Limpiar form -->
                <button type="reset" class="btn btn-link w-100 text-muted text-decoration-none btn-sm text-center">
                  Limpiar formulario
                </button>
              </form>

            </div>
          </div>
        </div>

        <!-- Reservas del cliente -->
        <div class="col-xl-7 col-lg-6">
          <div class="card shadow-sm rounded-4 h-100">
            <div class="card-body p-4 d-flex flex-column bg-dark">

              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="text-uppercase text-muted fw-bold tracking-wider" style="font-size: 0.68rem;">Tus
                  Reservas</span>
                <span class="badge bg-secondary bg-opacity-50 text-light rounded-pill px-3" id="contadorReservas">0
                  reservas</span>
              </div>
              <h5 class="fw-bold mb-1">Reservas registradas</h5>
              <p class="text-muted small mb-4">Tus reservas registradas apareceran en este listado.</p>

              <!-- Espacio donde visualiza el cliente sus reservas -->
              <div class="my-auto py-5 text-center" id="emptyState">
                <div class="mb-3 opacity-50">
                  <i class="bi bi-calendar-x display-4 text-muted"></i>
                </div>
                <h6 class="fw-bold text-light">Aún no tienes reservas registradas</h6>

              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="reserva.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <app-footer></app-footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
